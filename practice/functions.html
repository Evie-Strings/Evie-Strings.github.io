<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Functions</title>
    </head>
    <body>
        <h1>Here Be Functions</h1>
        <script>
            //Returns Nothing, Goes to Interact with Browser
            //Function Robot
            console.log("test"); //Calling/Excecuting a Function

            //Defining a Function
            function sayHi() {
                console.log("hi");

            }

            //Calling/Excecuting a Function
            sayHi();
            sayHi();

            //Functions can Take Parameters
            //Just like f(x)
            function sayHiToSomeone(who) {
                console.log("hi " + who);
            }

            //Calling/Excecuting a Function
            sayHiToSomeone("Maya");
            sayHiToSomeone("Liana");

            //Functions can have Many Parameters
            //f (x,y)
            function sayHiToTwoPeople(who1, who2) {
                console.log("hi " + who1 + " and " + who2);
            }

            sayHiToTwoPeople("Shoe", "Princess");
        </script>
    </body>
</html>
