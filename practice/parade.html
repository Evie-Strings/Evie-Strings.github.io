<!DOCTYPE html>
<html>
    <head>
        <title>Parade Animation</title>
    </head>
    <body>
        <h1>Parade!!</h1>
        <canvas width=1600 height=800 id="myCanvas"></canvas>

        <script>
            const canvas = document.getElementById("myCanvas");
            const ctx = canvas.getContext("2d");

            let x = 0;
            let x2 = 0;
            let x3 = 0;
            let x4 = 0;

            let speed = 5;

            let time = 0;

            function animate(){
                time = time + 1;

                x = x + speed;

                if (time > 80) {
                    //later move x2
                    x2 = x2 + speed;
                }
                
                if (time > 160) {
                    //later move x3
                    x3 = x3 + speed;
                }

                if (time > 240) {
                    //later move x4
                    x4 = x4 + speed;
                }

                if (x > 1600) {
                    x = 0;
                }

                if (x2 > 1600) {
                    x2 = 0;
                }

                if (x3 > 1600) {
                    x3 = 0;
                }

                if (x4 > 1600) {
                    x4 = 0;
                }
        
        //clear
            ctx.clearRect(0, 0, 1600, 800);
        //draw

            //Blinky
            ctx.fillStyle = "rgb(241, 0, 7)";    

            ctx.beginPath();
            ctx.arc(x+100, 225, 100, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x, 225, 200, 70);

            ctx.beginPath();
            ctx.arc(x+25, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x+75, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x+125, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill(); 

            ctx.beginPath();
            ctx.arc(x+175, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill(); 

            //Eyes - Left
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x+110, 200, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x+85, 200, 50, 30);
            ctx.beginPath();
            ctx.arc(x+110, 230, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x+122.5, 200, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x+110, 200, 25, 30);
            ctx.beginPath();
            ctx.arc(x+122.5, 230, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Eyes - Right
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x+185, 200, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x+160, 200, 50, 30);
            ctx.beginPath();
            ctx.arc(x+185, 230, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x+197.5, 200, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x+185, 200, 25, 30);
            ctx.beginPath();
            ctx.arc(x+197.5, 230, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Pinky
            ctx.fillStyle = "rgb(242, 157, 245)";    

            ctx.beginPath();
            ctx.arc(x2+100, 225, 100, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x2, 225, 200, 70);

            ctx.beginPath();
            ctx.arc(x2+33.3, 295, 33.3, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x2+99.9, 295, 33.3, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x2+166.5, 295, 33.3, Math.PI, Math.PI * 2, true);
            ctx.fill(); 

            //Eyes - Left
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x2+67.5, 220, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x2+42.5, 220, 50, 30);
            ctx.beginPath();
            ctx.arc(x2+67.5, 250, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x2+67.5, 235, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x2+55, 235, 25, 30);
            ctx.beginPath();
            ctx.arc(x2+67.5, 262.5, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Eyes - Left
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x2+132.5, 220, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x2+107.5, 220, 50, 30);
            ctx.beginPath();
            ctx.arc(x2+132.5, 250, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x2+132.5, 235, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x2+120, 235, 25, 30);
            ctx.beginPath();
            ctx.arc(x2+132.5, 262.5, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Inky
            ctx.fillStyle = "rgb(32, 247, 245)";    

            ctx.beginPath();
            ctx.arc(x3+100, 225, 100, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x3, 225, 200, 70);

            ctx.beginPath();
            ctx.arc(x3+25, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x3+75, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x3+125, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill(); 

            ctx.beginPath();
            ctx.arc(x3+175, 295, 25, Math.PI, Math.PI * 2, true);
            ctx.fill(); 

            //Eyes - Right
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x3+90, 200, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x3+65, 200, 50, 30);
            ctx.beginPath();
            ctx.arc(x3+90, 230, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x3+77.5, 200, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x3+65, 200, 25, 30);
            ctx.beginPath();
            ctx.arc(x3+77.5, 230, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Eyes - Left
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x3+15, 200, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x3-10, 200, 50, 30);
            ctx.beginPath();
            ctx.arc(x3+15, 230, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x3+2.5, 200, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x3-10, 200, 25, 30);
            ctx.beginPath();
            ctx.arc(x3+2.5, 230, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Clyde
            ctx.fillStyle = "rgb(242, 164, 62)";    

            ctx.beginPath();
            ctx.arc(x4+100, 225, 100, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x4, 225, 200, 70);

            ctx.beginPath();
            ctx.arc(x4+33.3, 295, 33.3, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x4+99.9, 295, 33.3, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x4+166.5, 295, 33.3, Math.PI, Math.PI * 2, true);
            ctx.fill(); 

            //Eyes - Left
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x4+67.5, 140, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x4+42.5, 140, 50, 30);
            ctx.beginPath();
            ctx.arc(x4+67.5, 170, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x4+67.5, 128, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x4+55, 128, 25, 30);
            ctx.beginPath();
            ctx.arc(x4+67.5, 158, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            //Eyes - Right
            ctx.fillStyle = "rgb(222, 224, 252)";    

            ctx.beginPath();
            ctx.arc(x4+132.5, 140, 25, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x4+107.5, 140, 50, 30);
            ctx.beginPath();
            ctx.arc(x4+132.5, 170, 25, Math.PI, Math.PI * 2, true);
            ctx.fill();

            ctx.fillStyle = "rgb(22, 0, 244)";    

            ctx.beginPath();
            ctx.arc(x4+132.5, 128, 12.5, Math.PI, Math.PI * 2, false);
            ctx.fill();
            ctx.fillRect(x4+120, 128, 25, 30);
            ctx.beginPath();
            ctx.arc(x4+132.5, 158, 12.5, Math.PI, Math.PI * 2, true);
            ctx.fill();

            requestAnimationFrame(animate);
        }

        animate();

        </script>    
    </body>
</html>
