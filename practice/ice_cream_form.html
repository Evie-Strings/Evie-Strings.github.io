<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Ice Cream Form</title>
		<link rel="stylesheet" href="../css/navbar.css">
		<script src="../js/validate.js"></script>
		<style>
			input, label, select {
				display: block;
				margin: 4px;
			}

			.checkbox, .radio {
				display: inline;
			}

		</style>
	</head>
	<body>
		<ul class="navbar">
			<li class="navbar"><a href="../index.html">Home</a></li>
			<li class="dropdown">
				<a href="javascript:void(0)">Practice</a>
					<div class="dropdown-content">
						<a href="terminal.html">Basics of Vim</a>
						<a href="ice_cream_form.html">Ice Cream Form</a>
					</div>
			</li>
			<li><a href="../projects/recipes/index.html">Family Recipes</a></li>
			<li><a href="../reading.html">Reading Blog</a></li>
		</ul>

		<form action="https://httpbin.org/post"
			method="post">

			<label for="youremail">What is your email address?</label>
			<input type="email" name="youremail" id="youremail">

			<label for="yourphone">What is your phone number?</label>
			<input type="text" name="yourphone" id="yourphone">

			<label for="howmanypeople">How many people will you bring with you to the party?</label>
			<input type="text" name="howmanypeople" id="howmanypeople">

			<label for="vanilla">What is your favorite flavor of ice cream?</label>

			<input class="radio" type="radio" name="favflavor" id="vanilla">
			<label class="radio" for="vanilla">Vanilla</label><br>

			<input class="radio" type="radio" name="favflavor" id="chocolatechipflavor">
			<label class="radio" for="chocolatechipflavor">Chocolate Chip</label><br>

			<input class="radio" type="radio" name="favflavor" id="strawberry">
			<label class="radio" for="strawberry">Strawberry</label><br>

			<input class="radio" type="radio" name="favflavor" id="otherflavor">
			<label class="radio" for="otherflavor">Other</label><br>


			<label for="sprinkles">Which toppings do you like?</label>

			<input type="checkbox" class="checkbox" name="sprinkles" id="sprinkles">
			<label class="checkbox" for="sprinkles">Sprinkles</label><br>

			<input type="checkbox" class="checkbox" name="magicshell" id="magicshell">
			<label class="checkbox" for="magicshell">Magic Shell</label><br>

			<input type="checkbox" class="checkbox" name="chocolatechips" id="chocolatechips">
			<label class="checkbox" for="chocolatechips">Chocolate Chips</label><br>

			<input type="checkbox" class="checkbox" name="gummybears" id="gummybears">
			<label class="checkbox" for="gummybears">Gummy Bears</label><br>

			<input type="checkbox" class="checkbox" name="other" id="other">
			<label class="checkbox" for="other">Other</label><br>

			<label for="entertainment">What kind of entertainment should we have at the party?</label>
			<select name="entertainment" id="entertainment">
				<option value="choose">Choose</option>
  				<option value="balloonanimals">Balloon Animals</option>
  				<option value="bouncehouse">Bounce House</option>
  				<option value="clown">Clown</option>
				<option value="cornhole">Cornhole</option>
  				<option value="dj">DJ</option>
  				<option value="facepainting">Face Painting</option>
  				<option value="magician">Magician</option>

			</select>
			<label for="comments">Do you have any other suggestions or comments?</label>
			<input type="text" name="comments" id="comments">

			<button type="submit">Submit</button>
		</form>
	</body>
</html>
