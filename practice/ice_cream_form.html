<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Ice Cream Form</title>
		<script src="../js/validate.js"></script>
		<style>
			input, label, select {
				display: block;
				margin: 4px;
			}

			.checkbox, .radio {
				display: inline;
			}

		</style>
	</head>
	<body>
		<form action="https://httpbin.org/post"
			method="post">

			<label for="youremail">What is your email address?</label>
			<input type="email" name="youremail">

			<label for="yourphone">What is your phone number?</label>
			<input type="text" name="yourphone">

			<label for="howmanypeople">How many people will you bring with you to the party?</label>
			<input type="text" name="howmanypeople">

			<label for="favflavor">What is your favorite flavor of ice cream?</label>
			<input class="radio" type="radio" name="vanilla">
			<label class="radio" for="vanilla">Vanilla</label>

			<input class="radio" type="radio" name="chocolatechipflavor">
			<label class="radio" for="chocolatechipflavor">Chocolate Chip</label>
			<input class="radio" type="radio" name="strawberry">
			<label class="radio" for="strawberry">Strawberry</label>

			<input class="radio" type="radio" name="otherflavor">
			<label class="radio" for="otherflavor">Other</label>

			<label for="favtoppings">Which toppings do you like?</label>
			<input type="checkbox" class="checkbox" name="sprinkles">
			<label class="checkbox" for="sprinkles">Sprinkles</label><br>
			<input type="checkbox" class="checkbox" name="magicshell">
			<label class="checkbox" for="magicshell">Magic Shell</label><br>
			<input type="checkbox" class="checkbox" name="chocolatechips">
			<label class="checkbox" for="chocolatechips">Chocolate Chips</label><br>
			<input type="checkbox" class="checkbox" name="gummybears">
			<label class="checkbox" for="gummybears">Gummy Bears</label><br>
			<input type="checkbox" class="checkbox" name="other">
			<label class="checkbox" for="other">Other</label><br>

			<label for="entertainment">What kind of entertainment should we have at the party?</label>
			<select name="entertainment">
				<option value="choose">Choose</option>
  				<option value="balloonanimals">Balloon Animals</option>
  				<option value="bouncehouse">Bounce House</option>
  				<option value="clown">Clown</option>
				<option value="cornhole">Cornhole</option>
  				<option value="dj">DJ</option>
  				<option value="facepainting">Face Painting</option>
  				<option value="magician">Magician</option>

			</select>
			<label for="comments">Do you have any other suggestions or comments?<label>
			<input type="text" name="comments">


			<button type="submit">Submit</button>
		</form>
	</body>
</html>
